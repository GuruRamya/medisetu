services:
  - type: web
    name: medisetu-backend
    env: python
    rootDir: Medisetu/Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: OCR_API_KEY
        sync: false
